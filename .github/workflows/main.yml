name: Gerar Executável Windows (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar com PyInstaller
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "src;src" --name "rotina" src/main.py

    - name: Disponibilizar Artefato (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: rotina-Windows-Portatil
        path: dist/rotina/